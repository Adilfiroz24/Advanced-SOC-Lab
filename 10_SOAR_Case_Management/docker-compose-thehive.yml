version: "3.8"

# ============================================================
# Advanced SOC Lab — TheHive 5 + Cortex 3 + Elasticsearch
# Case Management and Automated Response Platform
# 
# Usage: docker-compose -f docker-compose-thehive.yml up -d
# TheHive UI:  http://localhost:9000 (admin/secret)
# Cortex UI:   http://localhost:9001
# ============================================================

networks:
  soc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  thehive_data:
  thehive_index:
  thehive_files:
  cortex_data:
  elasticsearch_data:
  cassandra_data:
  minio_data:

services:

  # ─────────────────────────────────────
  # Cassandra (TheHive backend DB)
  # ─────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: soc-cassandra
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.10
    environment:
      - CASSANDRA_CLUSTER_NAME=soc_thehive
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────
  # Elasticsearch (TheHive index)
  # ─────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: soc-thehive-es
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.11
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=soc-thehive
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────
  # MinIO (TheHive file storage)
  # ─────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: soc-minio
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.12
    command: server /data --console-address ":9090"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────
  # TheHive 5 — Case Management
  # ─────────────────────────────────────
  thehive:
    image: strangebee/thehive:5.2
    container_name: soc-thehive
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.20
    ports:
      - "9000:9000"
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
    volumes:
      - thehive_files:/opt/thp/thehive/files
      - ./thehive_config.conf:/etc/thehive/application.conf
    command:
      - --secret
      - "SOC-LAB-SECRET-KEY-CHANGE-IN-PROD"
      - "--cql-hostnames"
      - "cassandra"
      - "--index-backend"
      - "elasticsearch"
      - "--es-hostnames"
      - "elasticsearch"
      - "--s3-endpoint"
      - "http://minio:9000"
      - "--s3-access-key"
      - "minioadmin"
      - "--s3-secret-key"
      - "minioadmin123"
      - "--s3-bucket"
      - "thehive"
      - "--s3-use-path-access-style"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/status"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  # ─────────────────────────────────────
  # Cortex — Automated Response
  # ─────────────────────────────────────
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: soc-cortex
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.21
    ports:
      - "9001:9001"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
    volumes:
      - cortex_data:/var/lib/cortex
      - /var/run/docker.sock:/var/run/docker.sock  # Allow Cortex to run analyzer containers
      - ./cortex_config.conf:/etc/cortex/application.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/api/status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────
  # MISP — Threat Intelligence Platform
  # ─────────────────────────────────────
  misp-db:
    image: mysql:8.0
    container_name: soc-misp-db
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.30
    environment:
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misppassword
      - MYSQL_ROOT_PASSWORD=misproot
    volumes:
      - ./misp_db:/var/lib/mysql

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: soc-misp
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.31
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - misp-db
    environment:
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misppassword
      - MISP_ADMIN_EMAIL=admin@soc.lab
      - MISP_ADMIN_PASSPHRASE=SOCLabAdmin123!
      - MISP_BASEURL=https://192.168.56.10
      - TIMEZONE=UTC
    volumes:
      - ./misp_data:/var/www/MISP/app/files

  # ─────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: soc-proxy
    restart: unless-stopped
    networks:
      soc_net:
        ipv4_address: 172.20.0.99
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - thehive
      - cortex