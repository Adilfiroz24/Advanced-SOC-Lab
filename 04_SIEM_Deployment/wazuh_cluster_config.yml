# ============================================================
# Advanced SOC Lab — Wazuh Cluster Configuration
# File: wazuh_cluster_config.yml
#
# Defines a single-node Wazuh cluster suitable for the lab.
# To scale to a multi-node production cluster, add additional
# `worker` entries under `nodes:` and set `disabled: 'no'`.
#
# Apply by referencing this file from the Wazuh install assistant:
#   bash wazuh-install.sh -a -c wazuh_cluster_config.yml
# (this is also auto-generated/merged by wazuh_install.sh in this repo)
# ============================================================

# ── Cluster identity ─────────────────────────────────────────
nodes:
  # Wazuh Indexer node(s) — OpenSearch-compatible storage layer
  indexer:
    - name: node-1
      ip: "192.168.56.10"
      # role: master   # Uncomment + add more nodes for HA indexer cluster

  # Wazuh Manager node(s) — rule engine, agent communication
  server:
    - name: wazuh-1
      ip: "192.168.56.10"
      # node_type: master   # First server node must be 'master'
      # node_type: worker   # Additional server nodes are 'worker'

  # Wazuh Dashboard node — web UI (Kibana-based)
  dashboard:
    - name: dashboard
      ip: "192.168.56.10"

# ── Cluster-wide settings ─────────────────────────────────────
cluster:
  # Set to 'yes' to enable multi-manager clustering (lab default: single node)
  disabled: 'yes'
  hidden: 'no'
  node_name: wazuh-1
  node_type: master
  key: ''               # Auto-generated by wazuh-install.sh; do not hardcode
  port: 1516
  bind_addr: 0.0.0.0
  nodes:
    - "192.168.56.10"
  socket_timeout: 60
  connection_timeout: 60

# ── Indexer connection settings (used by Filebeat on the manager) ──
indexer:
  hosts:
    - "https://192.168.56.10:9200"
  username: admin
  # password is injected via INDEXER_PASSWORD env var — never hardcode here
  ssl_verification_mode: full
  ca_trusted_fingerprint: ""   # Populated automatically during cert generation

# ── Manager API settings ──────────────────────────────────────
api:
  host: 0.0.0.0
  port: 55000
  use_only_authd: false
  drop_privileges: true
  experimental_features: false
  max_request_per_minute: 300
  cors:
    enabled: true
    source_route: "*"
    expose_headers: "*"
    allow_headers: "*"
    allow_credentials: false

# ── Manager log level & alert output formats ─────────────────
ossec:
  logall: 'no'              # Set 'yes' to log ALL events (high disk usage)
  logall_json: 'no'
  email_notification: 'no'  # Configure SMTP below if enabling
  alerts:
    log_alert_level: 3      # Minimum level written to alerts.log
    email_alert_level: 12   # Minimum level that triggers email (if enabled)

# ── Email alerting (optional — disabled by default in lab) ───
email:
  enabled: false
  smtp_server: "smtp.yourdomain.com"
  smtp_port: 587
  from: "wazuh-alerts@soc.lab"
  to:
    - "soc-team@soc.lab"
  # SMTP credentials should be set via environment variables, not here

# ── Vulnerability detector module ─────────────────────────────
vulnerability_detector:
  enabled: 'yes'
  interval: '5m'
  run_on_start: 'yes'
  providers:
    - name: canonical
      enabled: 'yes'
      os:
        - jammy   # Ubuntu 22.04
    - name: redhat
      enabled: 'no'
    - name: nvd
      enabled: 'yes'

# ── Active response (automated containment) ───────────────────
active_response:
  - command: firewall-drop
    location: local
    rules_id:
      - 100001   # SSH brute force
      - 100002   # Windows auth brute force
      - 100003   # RDP brute force
    timeout: 600   # Auto-unblock after 10 minutes
  - command: host-deny
    location: local
    rules_id:
      - 100013   # Critical: LSASS credential dumping
      - 100012   # Critical: Shadow copy deletion (ransomware)
    timeout: 0     # Permanent until manually cleared

# ── Log retention / rotation ───────────────────────────────────
logging:
  level: info
  rotation:
    enabled: 'yes'
    max_size: "1G"
    interval: "1d"
    rotate: 7      # Keep 7 days of rotated logs locally

# ── Performance tuning ─────────────────────────────────────────
performance:
  # Indexer JVM heap — should be ~50% of available RAM, max 1g for lab
  indexer_heap_size: "1g"
  manager_max_agents: 100        # Lab default; production scales much higher
  analysisd_event_threads: 4
  remoted_worker_pool: 4